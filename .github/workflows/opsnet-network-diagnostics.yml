name: OPSNET Network Diagnostics (TEST)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/opsnet-network-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: OPSNET IPv4 and IPv6 connectivity (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Network routes and DNS
        shell: bash
        run: |
          set -u
          echo '=== Runner / network basics ==='
          uname -srm
          curl --version | head -n 2
          echo '=== Proxy settings present (values hidden) ==='
          for key in HTTPS_PROXY HTTP_PROXY ALL_PROXY NO_PROXY https_proxy http_proxy all_proxy no_proxy; do
            if [[ -n "${!key:-}" ]]; then echo "$key: configured"; else echo "$key: not set"; fi
          done
          echo '=== DNS resolution ==='
          for host in lspdfr-nl.nl support.rockstargames.com; do
            echo "--- $host: IPv4 ---"
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u | head -n 8 || true
            echo "--- $host: IPv6 ---"
            getent ahostsv6 "$host" | awk '{print $1}' | sort -u | head -n 8 || true
          done

      - name: Compare IPv4 IPv6 HTTP requests
        shell: bash
        run: |
          set -u
          urls=(
            'https://lspdfr-nl.nl/github-rockstar-test.json'
            'https://lspdfr-nl.nl/wp-json/opsnet-source-gateway/v1/rockstar-source'
            'https://support.rockstargames.com/gta-v'
          )
          labels=('OPSNET static JSON' 'OPSNET WordPress Source Gateway' 'Rockstar GTA V Support')
          for i in "${!urls[@]}"; do
            echo "=== ${labels[$i]} ==="
            for family in 4 6; do
              echo "--- IPv${family} GET / HTTP 1.1 ---"
              curl -"$family" --http1.1 --location --silent --show-error \
                --connect-timeout 5 --max-time 10 --max-redirs 3 \
                --output /dev/null \
                --write-out 'HTTP=%{http_code} remote_ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n' \
                "${urls[$i]}"
              code=$?
              echo "curl_exit=$code"
            done
          done
          echo 'NOTE: HTTP 200 means the endpoint responded, not that Rockstar version discovery succeeded.'

      - name: Compare Python urllib default route
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import urllib.request
          import urllib.error
          import time

          targets = {
              'OPSNET static JSON': 'https://lspdfr-nl.nl/github-rockstar-test.json',
              'OPSNET gateway': 'https://lspdfr-nl.nl/wp-json/opsnet-source-gateway/v1/rockstar-source',
              'Rockstar GTA V': 'https://support.rockstargames.com/gta-v',
          }
          for label, url in targets.items():
              t = time.monotonic()
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'OPSNET-Network-Diagnostics/1.0', 'Accept': 'application/json,text/html;q=0.9'})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      data = response.read(512)
                      print(f'{label}: HTTP {response.status}; content_type={response.headers.get("Content-Type", "unknown")}; sample_bytes={len(data)}; elapsed={time.monotonic()-t:.2f}s', flush=True)
              except Exception as exc:
                  print(f'{label}: {type(exc).__name__}: {exc}; elapsed={time.monotonic()-t:.2f}s', flush=True)
          PY

      - name: Summary
        shell: bash
        run: |
          echo '### OPSNET Network Diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo 'All requests were read-only. Review the **Compare IPv4 IPv6 HTTP requests** and **Compare Python urllib default route** steps for status, exit codes and timing.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'A successful workflow means diagnostics executed, **not** that endpoints were reachable.' >> "$GITHUB_STEP_SUMMARY"
