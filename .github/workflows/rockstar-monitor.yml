name: OPSNET Rockstar GTAV Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsnet-source-publish-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Rockstar GTAV Source Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rockstar GTAV controleren (fallback v1.3)
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import socket
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          
          INDEX_URL = "https://support.rockstargames.com/gta-v"
          # Alleen als diagnose: bevestigt NIET dat dit de nieuwste versie is.
          KNOWN_ARTICLE_URL = (
              "https://support.rockstargames.com/articles/"
              "4vRqEDvjUs9h7nqRUgc8YO/"
              "gtav-title-update-1-73-notes-ps5-ps4-"
              "xbox-series-x-or-s-xbox-one-pc-enhanced-legacy"
          )
          OUTPUT = Path("sources/rockstar-gtav.json")
          # Optioneel, uitsluitend beheerdersverificatie, zie instructies.
          MANUAL = Path("sources/rockstar-manual.json")
          MAX_BYTES = 2 * 1024 * 1024
          TIMEOUT = 12
          ATTEMPTS = 2
          MAX_STALE_HOURS = 48
          
          
          def utc_now():
              return datetime.now(timezone.utc).isoformat()
          
          
          def load_json(path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except (OSError, ValueError):
                  return {}
          
          
          def vt(value):
              if not re.fullmatch(r"\d{1,3}\.\d{1,3}", str(value or "")):
                  raise ValueError("Ongeldig GTAV-versienummer")
              return tuple(int(part) for part in value.split("."))
          
          
          def extract_versions(body):
              content = html.unescape(body).replace("\\/", "/")
              matches = []
              for m in re.finditer(r"GTA\s*V\s+Title\s+Update\s+(\d{1,3}\.\d{1,3})\s+Notes", content, re.I):
                  matches.append(m.group(1))
              for m in re.finditer(r"gtav-title-update-(\d{1,3})-(\d{1,3})-notes", content, re.I):
                  matches.append(m.group(1) + "." + m.group(2))
              return sorted(set(matches), key=vt, reverse=True)
          
          
          def get_page(url, label):
              error = "onbekend"
              for attempt in range(1, ATTEMPTS + 1):
                  start = time.monotonic()
                  print(f"OPSNET {label}: poging {attempt}/{ATTEMPTS}", flush=True)
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; OPSNET-Rockstar-Monitor/1.3)",
                      "Accept": "text/html,application/xhtml+xml",
                      "Accept-Language": "en-US,en;q=0.9",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                          code = resp.status
                          charset = resp.headers.get_content_charset() or "utf-8"
                          raw = resp.read(MAX_BYTES + 1)
                          if len(raw) > MAX_BYTES:
                              raise RuntimeError("Pagina groter dan 2 MiB")
                          body = raw.decode(charset, errors="replace")
                      print(f"OPSNET {label}: HTTP {code}; {len(raw)} bytes; {time.monotonic()-start:.1f}s", flush=True)
                      if code != 200:
                          raise RuntimeError(f"HTTP {code}")
                      return body, ""
                  except (urllib.error.HTTPError, urllib.error.URLError, socket.timeout, TimeoutError, OSError, RuntimeError) as exc:
                      error = f"{type(exc).__name__}: {exc}"
                  print(f"OPSNET {label}: {error} ({time.monotonic()-start:.1f}s)", flush=True)
                  if attempt < ATTEMPTS:
                      time.sleep(2)
              return None, error[:250]
          
          
          previous = load_json(OUTPUT)
          old_version = str(previous.get("version") or "").strip()
          now = utc_now()
          result = {
              "source": "rockstar_gtav",
              "provider": "Rockstar Games",
              "version": old_version,
              "title": previous.get("title") or (f"GTAV Title Update {old_version} Notes" if old_version else ""),
              "source_url": INDEX_URL,
              "checked_at": now,
              "last_success_at": previous.get("last_success_at", ""),
              "source_changed_at": previous.get("source_changed_at", ""),
              "status": "degraded",  # Bestaande OPSNET-frontend blijft compatibel.
              "verification_method": "unverified",
          }
          
          index_body, index_error = get_page(INDEX_URL, "overzicht")
          verified_version = None
          if index_body:
              versions = extract_versions(index_body)
              if versions:
                  verified_version = versions[0]
              else:
                  index_error = "Overzicht opgehaald, maar geen GTAV Title Update gevonden"
          
          if verified_version:
              if old_version and vt(verified_version) < vt(old_version):
                  result["error"] = f"Overzicht meldde oudere versie {verified_version}; vorige {old_version} behouden"
              else:
                  success_at = utc_now()
                  result.update({
                      "version": verified_version,
                      "title": f"GTAV Title Update {verified_version} Notes",
                      "status": "online",
                      "last_success_at": success_at,
                      "verification_method": "official_listing",
                  })
                  if verified_version != old_version or not result["source_changed_at"]:
                      result["source_changed_at"] = success_at
                  print(f"OPSNET: nieuwste versie via officieel Rockstar-overzicht bevestigd: {verified_version}")
          else:
              # Tweede officiële URL uitsluitend om de netwerkroute te toetsen; een oud
              # artikel is geen bewijs dat er sindsdien geen nieuwe versie verscheen.
              article_body, article_error = get_page(KNOWN_ARTICLE_URL, "bekend artikel")
              if article_body:
                  article_versions = extract_versions(article_body)
                  print(f"OPSNET: bekend artikel bereikbaar; titels: {article_versions[:3]}; nieuwste versie NIET bevestigd")
              else:
                  print(f"OPSNET: ook bekend artikel niet bereikbaar: {article_error}")
              result["error"] = (index_error or "Overzicht niet verifieerbaar")[:350]
          
              # Optionele handmatige bevestiging op basis van een door een beheerder
              # geraadpleegde officiële URL. Geen automatische claim 'ONLINE'.
              manual = load_json(MANUAL)
              try:
                  candidate = str(manual["version"]).strip()
                  verified_at = datetime.fromisoformat(str(manual["verified_at"]).replace("Z", "+00:00"))
                  evidence = str(manual["evidence_url"])
                  if verified_at.tzinfo is None or not evidence.startswith("https://support.rockstargames.com/"):
                      raise ValueError("Tijdzone of officiële URL ontbreekt")
                  if verified_at > datetime.now(timezone.utc) + timedelta(minutes=5):
                      raise ValueError("Verificatietijd ligt in de toekomst")
                  if (datetime.now(timezone.utc) - verified_at) > timedelta(hours=MAX_STALE_HOURS):
                      raise ValueError("Handmatige verificatie is ouder dan 48 uur")
                  vt(candidate)
                  if old_version and vt(candidate) < vt(old_version):
                      raise ValueError("Handmatig versienummer is ouder")
                  result.update({
                      "version": candidate,
                      "title": f"GTAV Title Update {candidate} Notes",
                      "verification_method": "manual_official_link",
                      "manual_verified_at": verified_at.isoformat(),
                      "manual_evidence_url": evidence,
                  })
                  if candidate != old_version:
                      result["source_changed_at"] = verified_at.isoformat()
                  # last_success_at is EXPLICIET de laatste automatische Rockstar-HTTP-check.
                  print(f"OPSNET: handmatig bevestigde versie {candidate}; automatische controle blijft DEGRADED")
              except (KeyError, ValueError, TypeError) as exc:
                  if MANUAL.exists():
                      print(f"OPSNET: handmatige bron geweigerd: {exc}")
          
          result["checked_at"] = utc_now()
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("OPSNET resultaat:", json.dumps({k: result.get(k) for k in (
              "version", "status", "verification_method", "checked_at", "last_success_at", "source_changed_at", "error"
          )}, ensure_ascii=False), flush=True)
          PY

      - name: Wijzigingen veilig publiceren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OPSNET Source Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add sources/rockstar-gtav.json
          if git diff --cached --quiet; then
            echo "OPSNET: geen wijzigingen om te publiceren."
            exit 0
          fi
          git commit -m "Update Rockstar GTAV source"
          for attempt in 1 2 3; do
            echo "OPSNET: publicatiepoging $attempt van 3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Git-conflict: handmatige controle nodig."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "OPSNET: succesvol gepubliceerd."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Publicatie na drie pogingen mislukt."
          exit 1
