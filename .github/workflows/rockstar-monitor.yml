name: OPSNET Rockstar GTAV Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "1,31 * * * *"

permissions:
  contents: write

concurrency:
  group: opsnet-rockstar-gtav-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Rockstar GTAV Source Monitor

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Repository ophalen
        uses: actions/checkout@v4


      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Rockstar GTAV controleren
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          SOURCE_ID = "rockstar_gtav"

          SOURCE_URL = (
              "https://support.rockstargames.com/gta-v"
          )

          OUTPUT = Path(
              "sources/rockstar-gtav.json"
          )


          def utc_now():
              return (
                  datetime
                  .now(timezone.utc)
                  .isoformat()
              )


          def version_tuple(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )


          def load_previous():
              if not OUTPUT.exists():
                  return {}

              try:
                  data = json.loads(
                      OUTPUT.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(data, dict):
                      return data

              except Exception:
                  pass

              return {}


          previous = load_previous()

          previous_version = str(
              previous.get(
                  "version",
                  ""
              )
          ).strip()


          req = urllib.request.Request(
              SOURCE_URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; "
                      "LSPDFR-NL OPSNET "
                      "Rockstar Monitor/1.0)",

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml",

                  "Accept-Language":
                      "en-US,en;q=0.9",

                  "Cache-Control":
                      "no-cache",
              },
          )


          result = {
              "source":
                  SOURCE_ID,

              "provider":
                  "Rockstar Games",

              "version":
                  previous_version,

              "title":
                  previous.get(
                      "title",
                      ""
                  ),

              "source_url":
                  SOURCE_URL,

              "checked_at":
                  utc_now(),

              "status":
                  "degraded",
          }


          try:

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  status_code = getattr(
                      response,
                      "status",
                      200
                  )

                  if (
                      status_code < 200 or
                      status_code >= 300
                  ):
                      raise RuntimeError(
                          "Rockstar gaf HTTP "
                          f"{status_code} terug."
                      )


                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )


              /*
               * Wordt hieronder door Python vervangen:
               * zie echte patterns-array.
               */
          except Exception:
              pass
          PY
