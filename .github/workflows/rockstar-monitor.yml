name: OPSNET Rockstar GTAV Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsnet-source-publish-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Rockstar GTAV Source Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rockstar GTAV controleren (Steam fallback v1.4)
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          
          OUTPUT = Path('sources/rockstar-gtav.json')
          MANUAL = Path('sources/rockstar-manual.json')
          ROCKSTAR_INDEX = 'https://support.rockstargames.com/gta-v'
          STEAM_API = 'https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/'
          STEAM_APPS = (271590, 3240220)  # GTA V Legacy & Enhanced
          MAX_BYTES = 2 * 1024 * 1024
          STEAM_TIMEOUT = 8
          ROCKSTAR_TIMEOUT = 8
          MAX_STALE_HOURS = 48
          
          
          def now_iso():
              return datetime.now(timezone.utc).isoformat()
          
          
          def read_json(path):
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
                  return obj if isinstance(obj, dict) else {}
              except (FileNotFoundError, OSError, ValueError):
                  return {}
          
          
          def vt(v):
              if not re.fullmatch(r'\d{1,3}\.\d{1,3}', str(v or '')):
                  raise ValueError('Ongeldige versie')
              return tuple(map(int, v.split('.')))
          
          
          def get_json(url, label, timeout):
              started = time.monotonic()
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'OPSNET-Source-Monitor/1.4 (+https://lspdfr-nl.nl)',
                  'Accept': 'application/json,text/html;q=0.9',
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      status = res.status
                      raw = res.read(MAX_BYTES + 1)
                  if status != 200 or len(raw) > MAX_BYTES:
                      raise ValueError('HTTP-fout of te grote respons')
                  print(f'OPSNET {label}: HTTP {status}, {len(raw)} bytes, {time.monotonic()-started:.1f}s', flush=True)
                  return raw, None
              except Exception as exc:
                  msg = f'{type(exc).__name__}: {exc}'[:180]
                  print(f'OPSNET {label}: {msg}, {time.monotonic()-started:.1f}s', flush=True)
                  return None, msg
          
          
          def rockstar_listing(body):
              text = html.unescape(body.decode('utf-8', 'replace')).replace('\\/', '/')
              matches = re.findall(r'GTA\s*V\s+Title\s+Update\s+(\d{1,3}\.\d{1,3})\s+Notes', text, re.I)
              matches += [f'{m[0]}.{m[1]}' for m in re.findall(r'gtav-title-update-(\d{1,3})-(\d{1,3})-notes', text, re.I)]
              return max(matches, key=vt) if matches else None
          
          
          def steam_announcements():
              # Steam returns publisher/community posts and other news; only accept the
              # exact named announcement feed and explicit title-update notes in TITLE.
              confirmed = []
              signals = []
              failures = []
              for appid in STEAM_APPS:
                  url = f'{STEAM_API}?appid={appid}&count=50&maxlength=0&feeds=steam_community_announcements'
                  raw, err = get_json(url, f'Steam {appid}', STEAM_TIMEOUT)
                  if raw is None:
                      failures.append(f'{appid}: {err}')
                      continue
                  try:
                      posts = json.loads(raw).get('appnews', {}).get('newsitems', [])
                      if not isinstance(posts, list):
                          raise ValueError('Ongeldige nieuwsstructuur')
                  except (ValueError, TypeError, AttributeError) as exc:
                      failures.append(f'{appid}: {exc}')
                      continue
                  for post in posts:
                      if post.get('feedname') != 'steam_community_announcements':
                          continue
                      title = html.unescape(str(post.get('title') or ''))
                      permalink = str(post.get('url') or '')
                      if not permalink.startswith(('https://store.steampowered.com/', 'https://steamcommunity.com/')):
                          continue
                      match = re.search(r'\bGTA\s*V\s+Title\s+Update\s+(\d{1,3}\.\d{1,3})\s+Notes\b', title, re.I)
                      # Een oud nieuwsbericht is geen actuele bevestiging.
                      posted_at = datetime.fromtimestamp(int(post.get('date') or 0), tz=timezone.utc)
                      recent = timedelta(0) <= datetime.now(timezone.utc) - posted_at <= timedelta(days=14)
                      if match and recent:
                          version = match.group(1)
                          vt(version)
                          confirmed.append({'version': version, 'title': title[:160], 'url': permalink, 'appid': appid})
                      elif re.search(r'\b(updat(e|ed)|patch|release|now available)\b', title, re.I):
                          signals.append({'title': title[:160], 'url': permalink, 'appid': appid})
              return confirmed, signals[:5], failures
          
          
          previous = read_json(OUTPUT)
          old = str(previous.get('version') or '')
          result = {
              'source': 'rockstar_gtav', 'provider': 'Rockstar Games',
              'version': old, 'title': previous.get('title') or (f'GTAV Title Update {old} Notes' if old else ''),
              'source_url': ROCKSTAR_INDEX,
              'checked_at': now_iso(),
              'last_success_at': previous.get('last_success_at', ''),
              'source_changed_at': previous.get('source_changed_at', ''),
              'status': 'degraded', 'verification_method': 'unverified',
          }
          
          # Fast independent news endpoint first. No Rockstar HTTP call if an explicit
          # publisher announcement already confirms a version, avoiding long timeouts.
          posts, signals, failures = steam_announcements()
          result['steam_feed_checked_at'] = now_iso() if len(failures) < len(STEAM_APPS) else ''
          result['news_signals'] = signals
          best = max(posts, key=lambda p: vt(p['version'])) if posts else None
          accepted = False
          if best and (not old or vt(best['version']) >= vt(old)):
              ts = now_iso()
              result.update({
                  'version': best['version'], 'title': f'GTAV Title Update {best["version"]} Notes',
                  'source_url': best['url'], 'verification_method': 'steam_publisher_announcement',
                  'status': 'online', 'last_success_at': ts,
                  'steam_confirmation_url': best['url'],
              })
              accepted = True
              if best['version'] != old or not result['source_changed_at']:
                  result['source_changed_at'] = ts
              print(f'OPSNET: expliciete Steam-uitgeverspublicatie bevestigd: {best["version"]}', flush=True)
          
          if not accepted:
              # One short official attempt, not three 15-second requests.
              raw, err = get_json(ROCKSTAR_INDEX, 'Rockstar', ROCKSTAR_TIMEOUT)
              version = rockstar_listing(raw) if raw else None
              if version and (not old or vt(version) >= vt(old)):
                  ts = now_iso()
                  result.update({'version': version, 'title': f'GTAV Title Update {version} Notes',
                                 'source_url': ROCKSTAR_INDEX, 'status': 'online',
                                 'verification_method': 'official_listing', 'last_success_at': ts})
                  if version != old or not result['source_changed_at']:
                      result['source_changed_at'] = ts
                  accepted = True
                  print(f'OPSNET: Rockstar-overzicht bevestigt versie {version}', flush=True)
              else:
                  result['error'] = (err or 'Geen herkenbare Rockstar Title Update in HTML')[:350]
                  if failures:
                      result['secondary_errors'] = failures[:2]
                  print('OPSNET: geen automatische bevestiging; huidige versie blijft behouden', flush=True)
          
          if not accepted:
              manual = read_json(MANUAL)
              try:
                  candidate = str(manual['version']).strip()
                  ts = datetime.fromisoformat(str(manual['verified_at']).replace('Z', '+00:00'))
                  proof = str(manual['evidence_url'])
                  if ts.tzinfo is None or not proof.startswith('https://support.rockstargames.com/'):
                      raise ValueError('Ongeldige officiële bewijslink of tijdzone')
                  if not timedelta(0) <= datetime.now(timezone.utc) - ts <= timedelta(hours=MAX_STALE_HOURS):
                      raise ValueError('Handmatige bevestiging buiten 48 uur')
                  if old and vt(candidate) < vt(old):
                      raise ValueError('Ouder dan bekende versie')
                  vt(candidate)
                  result.update({'version': candidate,
                                 'title': f'GTAV Title Update {candidate} Notes',
                                 'verification_method': 'manual_official_link',
                                 'manual_verified_at': ts.isoformat(), 'manual_evidence_url': proof})
                  if candidate != old:
                      result['source_changed_at'] = ts.isoformat()
                  print(f'OPSNET: handmatige versie {candidate}; status blijft DEGRADED', flush=True)
              except (KeyError, ValueError, TypeError) as exc:
                  if MANUAL.exists():
                      print(f'OPSNET: handmatig bewijs geweigerd: {exc}', flush=True)
          
          result['checked_at'] = now_iso()
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('OPSNET resultaat:', json.dumps({k: result.get(k) for k in (
              'version', 'status', 'verification_method', 'checked_at', 'last_success_at', 'source_changed_at', 'error'
          )}, ensure_ascii=False), flush=True)
          PY

      - name: Wijzigingen veilig publiceren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OPSNET Source Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add sources/rockstar-gtav.json
          if git diff --cached --quiet; then
            echo "OPSNET: geen wijzigingen om te publiceren."
            exit 0
          fi
          git commit -m "Update Rockstar GTAV source"
          for attempt in 1 2 3; do
            echo "OPSNET: publicatiepoging $attempt van 3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Git-conflict: handmatige controle nodig."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "OPSNET: succesvol gepubliceerd."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Publicatie na drie pogingen mislukt."
          exit 1
