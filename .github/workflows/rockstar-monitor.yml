name: OPSNET Rockstar GTAV Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "1,31 * * * *"

permissions:
  contents: write

concurrency:
  group: opsnet-rockstar-gtav-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Rockstar GTAV Source Monitor

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Repository ophalen
        uses: actions/checkout@v4


      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Rockstar GTAV controleren
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          SOURCE_ID = "rockstar_gtav"

          SOURCE_URL = (
              "https://support.rockstargames.com/gta-v"
          )

          OUTPUT = Path(
              "sources/rockstar-gtav.json"
          )


          def utc_now():
              return (
                  datetime
                  .now(timezone.utc)
                  .isoformat()
              )


          def version_tuple(version):
              return tuple(
                  int(part)
                  for part in version.split(".")
              )


          def load_previous():
              if not OUTPUT.exists():
                  return {}

              try:
                  data = json.loads(
                      OUTPUT.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(data, dict):
                      return data

              except Exception:
                  pass

              return {}


          previous = load_previous()

          previous_version = str(
              previous.get(
                  "version",
                  ""
              )
          ).strip()


          now = utc_now()

          req = urllib.request.Request(
              SOURCE_URL,
              headers={
                  "User-Agent":
                      "Mozilla/5.0 "
                      "(compatible; "
                      "LSPDFR-NL OPSNET "
                      "Rockstar Monitor/1.1)",

                  "Accept":
                      "text/html,"
                      "application/xhtml+xml",

                  "Accept-Language":
                      "en-US,en;q=0.9",

                  "Cache-Control":
                      "no-cache",
              },
          )


          result = {
              "source":
                  SOURCE_ID,

              "provider":
                  "Rockstar Games",

              "version":
                  previous_version,

              "title":
                  previous.get(
                      "title",
                      ""
                  ),

              "source_url":
                  SOURCE_URL,

              # Heartbeat: iedere uitgevoerde monitor-run.
              "checked_at":
                  now,

              # Alleen vernieuwen wanneer Rockstar succesvol is uitgelezen.
              "last_success_at":
                  previous.get(
                      "last_success_at",
                      ""
                  ),

              # Alleen vernieuwen bij een inhoudelijke bronwijziging.
              "source_changed_at":
                  previous.get(
                      "source_changed_at",
                      previous.get(
                          "checked_at",
                          ""
                      )
                  ),

              "status":
                  "degraded",
          }


          try:

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  status_code = getattr(
                      response,
                      "status",
                      200
                  )

                  if (
                      status_code < 200 or
                      status_code >= 300
                  ):
                      raise RuntimeError(
                          "Rockstar gaf HTTP "
                          f"{status_code} terug."
                      )


                  html = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )


              patterns = (
                  r"GTAV\s+Title\s+Update\s+"
                  r"([0-9]{1,3}\.[0-9]{1,3})"
                  r"\s+Notes",

                  r"GTA\s*V\s+Title\s+Update\s+"
                  r"([0-9]{1,3}\.[0-9]{1,3})"
                  r"\s+Notes",
              )


              matches = []

              for pattern in patterns:

                  matches.extend(
                      re.findall(
                          pattern,
                          html,
                          flags=re.IGNORECASE,
                      )
                  )


              versions = sorted(
                  set(matches),
                  key=version_tuple,
                  reverse=True,
              )


              if not versions:
                  raise RuntimeError(
                      "Geen geldige GTAV "
                      "Title Update-versie "
                      "gevonden."
                  )


              detected_version = versions[0]


              if (
                  previous_version and
                  version_tuple(
                      detected_version
                  ) <
                  version_tuple(
                      previous_version
                  )
              ):

                  raise RuntimeError(
                      "Rockstar rapporteert "
                      "onverwacht een oudere "
                      "versie: "
                      f"{detected_version}; "
                      "OPSNET behoudt "
                      f"{previous_version}."
                  )


              result.update({
                  "version":
                      detected_version,

                  "title":
                      "GTAV Title Update "
                      f"{detected_version} Notes",

                  "status":
                      "online",

                  "last_success_at":
                      now,
              })


          except Exception as exc:

              result["error"] = str(
                  exc
              )


          semantic_keys = (
              "source",
              "provider",
              "version",
              "title",
              "source_url",
              "status",
              "error",
          )


          previous_semantic = {
              key:
                  previous.get(key)

              for key in semantic_keys
          }


          current_semantic = {
              key:
                  result.get(key)

              for key in semantic_keys
          }


          changed = (
              not OUTPUT.exists() or
              previous_semantic !=
              current_semantic
          )


          if changed:
              result["source_changed_at"] = now

              print(
                  "OPSNET: inhoudelijke "
                  "Rockstar-wijziging gedetecteerd."
              )
          else:
              print(
                  "OPSNET: geen inhoudelijke "
                  "Rockstar-wijziging."
              )


          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          # Altijd wegschrijven zodat checked_at als echte heartbeat werkt.
          OUTPUT.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8",
          )


          print(
              "Heartbeat:",
              result.get(
                  "checked_at",
                  "unknown"
              )
          )

          print(
              "Laatste succesvolle broncontrole:",
              result.get(
                  "last_success_at",
                  "unknown"
              )
          )

          print(
              "Laatste inhoudelijke bronwijziging:",
              result.get(
                  "source_changed_at",
                  "unknown"
              )
          )

          print(
              "Versie:",
              result.get(
                  "version",
                  "unknown"
              )
          )

          print(
              "Status:",
              result.get(
                  "status",
                  "unknown"
              )
          )
          PY


      - name: Wijzigingen committen
        run: |
          git config user.name \
            "OPSNET Source Monitor"

          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            sources/rockstar-gtav.json

          if git diff --cached --quiet; then
            echo "Geen bronwijzigingen om te committen."
            exit 0
          fi

          git commit \
            -m "Update Rockstar GTAV source"

          git push
