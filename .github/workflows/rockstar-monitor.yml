name: OPSNET Rockstar GTAV Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opsnet-source-publish-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Rockstar GTAV Source Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rockstar GTAV controleren (diagnostiek v1.2)
        run: |
          python - <<'PY'
          import html
          import json
          import re
          import socket
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path


          SOURCE_URL = (
          "https://support.rockstargames.com/gta-v"
           )

          OUTPUT = Path("sources/rockstar-gtav.json")
          MAX_BYTES = 2 * 1024 * 1024
          ATTEMPTS = 3
          TIMEOUT = 15


          def utc_now():
              return datetime.now(timezone.utc).isoformat()


          def version_tuple(version):
              return tuple(int(x) for x in version.split("."))


          def previous_data():
              try:
                  obj = json.loads(OUTPUT.read_text(encoding="utf-8"))
                  return obj if isinstance(obj, dict) else {}
              except (FileNotFoundError, ValueError, OSError):
                  return {}


          def extract_version(page):
              # Normaliseer HTML-entiteiten, whitespace en eventueel ge-escape-te tekst.
              content = html.unescape(page).replace("\\/", "/")
              patterns = [
                  r"GTA\s*V\s+Title\s+Update\s+([0-9]{1,3}\.[0-9]{1,3})\s+Notes",
                  r"GTAV\s+Title\s+Update\s+([0-9]{1,3}\.[0-9]{1,3})\s+Notes",
                  r"gtav-title-update-([0-9]{1,3})-([0-9]{1,3})-notes",
              ]
              matches = []
              for idx, pattern in enumerate(patterns):
                  for match in re.finditer(pattern, content, re.IGNORECASE):
                      if idx == 2:
                          matches.append(f"{int(match.group(1))}.{match.group(2)}")
                      else:
                          matches.append(match.group(1))
              return max(set(matches), key=version_tuple) if matches else None


          previous = previous_data()
          old_version = str(previous.get("version") or "").strip()
          result = {
              "source": "rockstar_gtav",
              "provider": "Rockstar Games",
              "version": old_version,
              "title": previous.get("title", ""),
              "source_url": SOURCE_URL,
              "checked_at": utc_now(),
              "last_success_at": previous.get("last_success_at", ""),
              "source_changed_at": previous.get("source_changed_at", previous.get("checked_at", "")),
              "status": "degraded",
          }

          for attempt in range(1, ATTEMPTS + 1):
              started = time.monotonic()
              print(f"OPSNET: Rockstar HTTP-poging {attempt}/{ATTEMPTS}", flush=True)
              req = urllib.request.Request(SOURCE_URL, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; OPSNET-Rockstar-Monitor/1.2)",
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Cache-Control": "no-cache",
              })
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                      http_status = response.status
                      charset = response.headers.get_content_charset() or "utf-8"
                      raw = response.read(MAX_BYTES + 1)
                      if len(raw) > MAX_BYTES:
                          raise RuntimeError("HTML-pagina groter dan 2 MiB")
                      text = raw.decode(charset, errors="replace")
                  duration = time.monotonic() - started
                  print(f"OPSNET: HTTP {http_status}; {len(raw)} bytes; {duration:.1f}s; charset={charset}", flush=True)
                  version = extract_version(text)
                  if not version:
                      raise RuntimeError("HTTP ontvangen, maar geen geldige GTAV Title Update-versie in HTML of artikellink gevonden")
                  if old_version and version_tuple(version) < version_tuple(old_version):
                      raise RuntimeError(f"Bron rapporteert oudere versie {version} dan bekende {old_version}")
                  now = utc_now()
                  if version != old_version or not previous.get("source_changed_at"):
                      result["source_changed_at"] = now
                      print(f"OPSNET: echte versiewijziging: {old_version or '(onbekend)'} -> {version}", flush=True)
                  result.update({
                      "version": version,
                      "title": f"GTAV Title Update {version} Notes",
                      "status": "online",
                      "last_success_at": now,
                      "checked_at": now,
                  })
                  print(f"OPSNET: broncontrole OK, versie {version}", flush=True)
                  break
              except urllib.error.HTTPError as exc:
                  error = f"HTTP {exc.code} ({exc.reason})"
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError, RuntimeError, UnicodeError) as exc:
                  error = f"{type(exc).__name__}: {exc}"
              except Exception as exc:
                  error = f"Onverwachte {type(exc).__name__}: {exc}"
              print(f"OPSNET: poging {attempt} mislukt na {time.monotonic()-started:.1f}s: {error}", flush=True)
              result["error"] = error[:350]
              if attempt < ATTEMPTS:
                  time.sleep(2 * attempt)

          result["checked_at"] = utc_now()
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          OUTPUT.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("OPSNET resultaat:", json.dumps({key: result.get(key) for key in ("version", "status", "checked_at", "last_success_at", "source_changed_at", "error")}, ensure_ascii=False), flush=True)
          # Een tijdelijke Rockstar-fout is een bronstatus, geen fout in de GitHub-workflow.
          # De JSON wordt dus ook bij DEGRADED veilig gepubliceerd.
          PY

      - name: Wijzigingen veilig publiceren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OPSNET Source Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add sources/rockstar-gtav.json
          if git diff --cached --quiet; then
            echo "OPSNET: geen wijzigingen om te publiceren."
            exit 0
          fi
          git commit -m "Update Rockstar GTAV source"
          for attempt in 1 2 3; do
            echo "OPSNET: publicatiepoging $attempt van 3"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Git-conflict: handmatige controle nodig."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "OPSNET: succesvol gepubliceerd."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Publicatie na drie pogingen mislukt."
          exit 1
