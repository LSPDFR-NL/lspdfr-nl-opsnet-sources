name: OPSNET Rockstar Monitor v1.5 (READ-ONLY TEST)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/opsnet-rockstar-v15-readonly-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Rockstar browserheaders herhaalbaarheid (alleen lezen)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Controleer Rockstar drie keer
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import html
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          INDEX = "https://support.rockstargames.com/gta-v"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; OPSNET-Source-Diagnostic/1.0)",
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.9",
          }
          MAX_BYTES = 2 * 1024 * 1024
          TIMEOUT = 12
          CHECKS = 3
          BASELINE = (1, 73)  # only a sanity check against a stale/old result


          def url_is_official(value):
              parsed = urllib.parse.urlparse(value)
              return parsed.scheme == "https" and parsed.hostname == "support.rockstargames.com"


          def versions_from_listing(value):
              text = html.unescape(value).replace('\\/', '/')
              # Capture both visible titles and article slugs. These are found in public HTML.
              title_pattern = r"\bGTA\s*V\s+Title\s+Update\s+(\d{1,3})\.(\d{1,3})\s+Notes\b"
              slug_pattern = r"\bgtav-title-update-(\d{1,3})-(\d{1,3})-notes\b"
              versions = set()
              for p in (title_pattern, slug_pattern):
                  for a,b in re.findall(p, text, re.IGNORECASE):
                      versions.add((int(a), int(b)))
              return sorted(versions, reverse=True)


          def check(index):
              started = time.monotonic()
              try:
                  req = urllib.request.Request(INDEX, headers=HEADERS, method="GET")
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                      status = response.status
                      final_url = response.geturl()
                      content_type = response.headers.get("Content-Type", "")
                      body = response.read(MAX_BYTES + 1)
                  if status != 200:
                      raise ValueError(f"HTTP {status}")
                  if not url_is_official(final_url):
                      raise ValueError("Redirect naar een niet-officieel domein")
                  if len(body) > MAX_BYTES:
                      raise ValueError("Respons groter dan 2 MiB")
                  if "text/html" not in content_type.lower():
                      raise ValueError(f"Onverwacht Content-Type: {content_type[:90]}")
                  content = body.decode("utf-8", errors="replace")
                  if not re.search(r"<html\b|<!doctype html", content, re.IGNORECASE):
                      raise ValueError("Geen geldig HTML-document")
                  versions = versions_from_listing(content)
                  if not versions:
                      raise ValueError("Geen Title Update-titels of -slugs gevonden")
                  version = versions[0]
                  if version < BASELINE:
                      raise ValueError("Gedetecteerde versie lager dan bekende 1.73")
                  seconds = time.monotonic() - started
                  print(f"Poging {index}/{CHECKS}: OK HTTP 200; {len(body)} bytes; {seconds:.2f}s; nieuwste={version[0]}.{version[1]}; aangetroffen versies={len(versions)}; officiële host=ja", flush=True)
                  return version, "OK"
              except (urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
                  err = f"{type(exc).__name__}: {str(exc)[:180]}"
              except Exception as exc:
                  err = f"{type(exc).__name__}: {str(exc)[:180]}"
              print(f"Poging {index}/{CHECKS}: MISLUKT ({time.monotonic()-started:.2f}s); {err}", flush=True)
              return None, err


          print("OPSNET Rockstar Monitor v1.5 — read-only herhaalbaarheidstest", flush=True)
          print("Verzoeken naar Rockstar Support zonder cookies/tokens, zonder wijzigingen aan productie.", flush=True)
          results = []
          for num in range(1, CHECKS + 1):
              results.append(check(num))
              if num < CHECKS:
                  time.sleep(2)

          accepted = [version for version, _ in results if version is not None]
          consistent = len(set(accepted)) <= 1
          passed = len(accepted) >= 2 and consistent
          print(f"Resultaat: {len(accepted)}/{CHECKS} controles geslaagd; consistent={consistent}; voldoende voor proef={passed}", flush=True)
          summary_file = Path(__import__("os").environ.get("GITHUB_STEP_SUMMARY", "/tmp/opsnet-v15-summary.md"))
          lines = [
              "## OPSNET Rockstar Monitor v1.5 — read-only test",
              "",
              f"- Controles met geldige officiële titels: **{len(accepted)}/{CHECKS}**",
              f"- Versies onderling consistent: **{'ja' if consistent else 'nee'}**",
              f"- Resultaat: **{'GESLAAGD' if passed else 'ONVOLDOENDE'}**",
              "- Bronbestand `sources/rockstar-gtav.json`: **niet gewijzigd**",
              "- Dit is een bereikbaarheidstest, geen productiedistributie.",
              "",
              "| Poging | Versie | Status |",
              "|---|---|---|",
          ]
          for i,(version, status) in enumerate(results,1):
              lines.append(f"| {i} | {version[0]}.{version[1]} | {status} |" if version else f"| {i} | — | {status.replace('|','/')} |")
          with summary_file.open("a", encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          if not passed:
              raise SystemExit("OPSNET: onvoldoende betrouwbare controles; productiemonitor ongewijzigd.")
          print("OPSNET: read-only v1.5 test geslaagd; productiemonitor ongewijzigd.")
          PYCODE
