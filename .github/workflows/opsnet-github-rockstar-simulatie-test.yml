name: OPSNET Rockstar Simulation (TEST)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: OPSNET HTML and optional JSON source check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test OPSNET simulation endpoints (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request

          BASE = 'https://lspdfr-nl.nl'
          SOURCES = (
              ('HTML', BASE + '/github-rockstar-test/', True),
              ('JSON (optioneel)', BASE + '/github-rockstar-test.json', False),
          )
          VERSION_RE = re.compile(r'\b(?:GTAV|GTA\s*V)\s+Title\s+Update\s+(\d{1,3}\.\d{1,3})\s+Notes\b', re.I)
          MAX_BYTES = 256 * 1024
          html_ok = False
          for label, url, required in SOURCES:
              print(f'\n=== {label} ===\nURL: {url}', flush=True)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'OPSNET-Simulation-Test/1.0',
                  'Accept': 'text/html,application/json;q=0.9,*/*;q=0.8',
              })
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      status = response.status
                      ctype = response.headers.get('Content-Type', '')
                      body = response.read(MAX_BYTES + 1)
                  if len(body) > MAX_BYTES:
                      raise ValueError('Response exceeds 256 KiB')
                  text = body.decode('utf-8', errors='replace')
                  print(f'HTTP: {status}; Content-Type: {ctype}; Bytes: {len(body)}; Seconds: {time.monotonic()-started:.2f}', flush=True)
                  if status != 200:
                      raise ValueError(f'Unexpected HTTP status {status}')
                  if label == 'HTML':
                      match = VERSION_RE.search(text)
                      if not match:
                          raise ValueError('No GTAV Title Update X.XX Notes text found')
                      print('Detected version:', match.group(1), flush=True)
                      html_ok = True
                  else:
                      obj = json.loads(text)
                      if not isinstance(obj, dict):
                          raise ValueError('Expected JSON object')
                      version = str(obj.get('version', ''))
                      if not re.fullmatch(r'\d{1,3}\.\d{1,3}', version):
                          raise ValueError('No valid version in JSON')
                      print('Detected version:', version, flush=True)
              except urllib.error.HTTPError as exc:
                  print(f'HTTP error {exc.code}: {exc.reason}', flush=True)
              except Exception as exc:
                  print(f'{type(exc).__name__}: {exc}', flush=True)
              if not required:
                  print('Optional JSON diagnostic: does not change production data.', flush=True)

          if not html_ok:
              raise SystemExit('HTML simulation failed. Check the HTML response or connectivity.')
          print('\nOPSNET: HTML simulation passed. No data was written.', flush=True)
          PY
